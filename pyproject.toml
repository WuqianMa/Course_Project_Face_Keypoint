[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-keypoints-ablation"
version = "0.1.0"
description = "Facial keypoint regression and data augmentation ablation study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[project.scripts]
facial-keypoints = "facial_keypoints.cli:main"

[tool.setuptools.packages.find]
include = ["facial_keypoints*"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
